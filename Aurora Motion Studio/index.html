
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aurora Motion Studio</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="hero" id="home">

        <!-- Animated Background -->
        <div class="background-effect"></div>

        <!-- Floating Light Effects -->
        <div class="light-orb orb-one"></div>
        <div class="light-orb orb-two"></div>
        <div class="light-orb orb-three"></div>

        <!-- Navigation -->
        <nav class="navbar">
            <a href="#home" class="logo">AURORA<span>.</span></a>

            <div class="nav-links">
                <a href="#home">Home</a>
                <a href="#about">About</a>
                <a href="#contact">Contact</a>
            </div>

            <a href="#contact" class="nav-button">Let's Talk</a>
        </nav>

        <!-- Hero Content -->
        <section class="hero-content" id="about">

            <p class="eyebrow">CREATIVE DIGITAL EXPERIENCES</p>

            <h1>
                Design Beyond
                <span>Imagination.</span>
            </h1>

            <p class="description">
                We explore the intersection of creativity,
                technology and motion to create extraordinary
                digital experiences.
            </p>

            <div class="hero-actions">
                <a href="#contact" class="primary-button">
                    Explore Experience
                </a>

                <a href="#about" class="secondary-button">
                    Discover More
                </a>
            </div>

        </section>

        <!-- Decorative Circle -->
        <div class="orbit orbit-one"></div>
        <div class="orbit orbit-two"></div>

        <!-- Footer -->
        <footer class="hero-footer" id="contact">
            <span>CREATIVE DIGITAL STUDIO</span>
            <span>DESIGNED FOR THE FUTURE</span>
            <span>01 / 06</span>
        </footer>

    </main>

</body>
</html>
